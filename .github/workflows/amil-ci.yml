name: AMIL CI

# AMIL lives in amil/ (docs/DECISIONS.md D-001); this workflow only runs for changes there.
on:
  push:
    paths: ["amil/**", ".github/workflows/amil-ci.yml"]
  pull_request:
    paths: ["amil/**", ".github/workflows/amil-ci.yml"]

defaults:
  run:
    working-directory: amil

jobs:
  verify:
    name: Format, lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amil
          POSTGRES_PASSWORD: amil
          POSTGRES_DB: amil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amil -d amil"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://amil:amil@localhost:5432/amil?schema=public
      TEST_DATABASE_URL: postgresql://amil:amil@localhost:5432/amil?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: amil/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: amil/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
