name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Format, lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amil
          POSTGRES_PASSWORD: amil
          POSTGRES_DB: amil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amil -d amil"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://amil:amil@localhost:5432/amil?schema=public
      TEST_DATABASE_URL: postgresql://amil:amil@localhost:5432/amil?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amil
          POSTGRES_PASSWORD: amil
          POSTGRES_DB: amil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amil -d amil"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://amil:amil@localhost:5432/amil?schema=public
      REDIS_URL: redis://localhost:6379
      # Demo-only secrets (same values as .env.example). Never real credentials.
      AMIL_API_KEYS: ddb-demo-key:demo-only-secret-change-me-0123456789abcdef:bank_ddb
      SESSION_SECRET: demo-only-session-secret-change-me-0123456789
      AUDIT_HASH_SECRET: demo-only-audit-hash-secret-change-me-0123456
      WIDGET_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      AMIL_API_URL: http://localhost:4000
      AMIL_DEMO_KEY_ID: ddb-demo-key
      AMIL_DEMO_KEY_SECRET: demo-only-secret-change-me-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @amil/demo-bank exec playwright install --with-deps chromium

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Build demo bank and console
        run: pnpm turbo run build --filter=@amil/demo-bank --filter=@amil/console

      - name: Playwright (demo bank)
        run: pnpm --filter @amil/demo-bank e2e

      # The console suite changes packs and copy through the UI and checks the demo bank; it
      # restores what it changes, and runs after the demo-bank suite.
      - name: Playwright (bank console)
        run: pnpm --filter @amil/console e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/demo-bank/playwright-report
            apps/console/playwright-report
          retention-days: 7
