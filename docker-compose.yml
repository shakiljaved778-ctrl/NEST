# Local stack for AMIL. Everything here is for DEMO use with synthetic data only.
#
#   docker compose up -d postgres redis      # just the data stores (for `pnpm dev`)
#   docker compose up --build                # full stack: migrate + seed, api, demo-bank, console
name: amil

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amil
      POSTGRES_PASSWORD: amil
      POSTGRES_DB: amil
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amil -d amil"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations and load the synthetic Doha Demo Bank dataset.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    environment:
      DATABASE_URL: postgresql://amil:amil@postgres:5432/amil?schema=public
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://amil:amil@postgres:5432/amil?schema=public
      REDIS_URL: redis://redis:6379
      # Demo-only secrets (same as .env.example). Replace for any real deployment.
      AMIL_API_KEYS: ddb-demo-key:demo-only-secret-change-me-0123456789abcdef:bank_ddb
      SESSION_SECRET: demo-only-session-secret-change-me-0123456789
      AUDIT_HASH_SECRET: demo-only-audit-hash-secret-change-me-0123456
      WIDGET_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Proactive packs (rewards.expiry, account.dormancy) on BullMQ schedules from ProactiveJob rows.
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://amil:amil@postgres:5432/amil?schema=public
      REDIS_URL: redis://redis:6379
      # Demo-only secrets (same as .env.example). Replace for any real deployment.
      AMIL_API_KEYS: ddb-demo-key:demo-only-secret-change-me-0123456789abcdef:bank_ddb
      SESSION_SECRET: demo-only-session-secret-change-me-0123456789
      AUDIT_HASH_SECRET: demo-only-audit-hash-secret-change-me-0123456
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  demo-bank:
    build: { context: ., dockerfile: apps/demo-bank/Dockerfile }
    environment:
      DATABASE_URL: postgresql://amil:amil@postgres:5432/amil?schema=public
      # Server-to-server (bank backend -> AMIL) inside the compose network
      AMIL_API_URL: http://api:4000
      AMIL_DEMO_KEY_ID: ddb-demo-key
      AMIL_DEMO_KEY_SECRET: demo-only-secret-change-me-0123456789abcdef
      # Browser -> AMIL (the widget), via the published port
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

  console:
    build: { context: ., dockerfile: apps/console/Dockerfile }
    environment:
      # The console's backend signs staff in over HMAC and calls /v1/admin/* server-side; the
      # browser only talks to the console (its token stays in an httpOnly cookie).
      AMIL_API_URL: http://api:4000
      AMIL_DEMO_KEY_ID: ddb-demo-key
      AMIL_DEMO_KEY_SECRET: demo-only-secret-change-me-0123456789abcdef
    ports: ["3001:3001"]
    depends_on: [api]

volumes:
  pgdata:
